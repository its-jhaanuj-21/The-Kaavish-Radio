<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ogBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#22150f" />
      <stop offset="45%" stop-color="#140c08" />
      <stop offset="85%" stop-color="#0a0503" />
      <stop offset="100%" stop-color="#050302" />
    </radialGradient>

    <!-- Warm Amber Aura Glow -->
    <radialGradient id="ogAura" cx="320" cy="315" r="380">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#fde68a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Rim Gradient -->
    <linearGradient id="ogRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.8" />
    </linearGradient>

    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#ogAura)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="rgba(245, 158, 11, 0.35)" stroke-width="2" />
  <rect x="34" y="34" width="1132" height="562" rx="14" fill="none" stroke="rgba(251, 191, 36, 0.15)" stroke-width="1" stroke-dasharray="8 6" />

  <!-- LEFT: TKR Emblem Disc (Center cx=320, cy=315) -->
  <g transform="translate(60, 0)">
    <!-- Vinyl Disc Shadow -->
    <circle cx="260" cy="315" r="215" fill="#000000" opacity="0.6" filter="url(#ogGlow)" />
    <!-- Vinyl Outer -->
    <circle cx="260" cy="315" r="210" fill="#140c08" stroke="url(#ogRim)" stroke-width="4" />
    <circle cx="260" cy="315" r="198" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="5 4" />
    
    <!-- Concentric Grooves -->
    <circle cx="260" cy="315" r="176" fill="none" stroke="#fbbf24" stroke-opacity="0.08" stroke-width="1" />
    <circle cx="260" cy="315" r="158" fill="none" stroke="#fbbf24" stroke-opacity="0.07" stroke-width="1" />
    <circle cx="260" cy="315" r="140" fill="none" stroke="#fbbf24" stroke-opacity="0.08" stroke-width="1" />

    <!-- Center Label -->
    <circle cx="260" cy="315" r="110" fill="#1a100b" stroke="url(#ogRim)" stroke-width="2" />
    <circle cx="260" cy="315" r="108" fill="#f59e0b" opacity="0.08" />

    <!-- Urdu on Label -->
    <text x="260" y="250" text-anchor="middle" font-family="'Amiri', 'Georgia', serif" font-size="22" font-weight="bold" fill="#fde68a" opacity="0.9">کاوِش • रुहानी शाम</text>

    <!-- TKR Monogram -->
    <text x="260" y="338" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="78" font-weight="900" letter-spacing="6" fill="url(#ogGold)">TKR</text>

    <!-- Star Divider -->
    <g transform="translate(260, 360)">
      <line x1="-60" y1="0" x2="-14" y2="0" stroke="url(#ogGold)" stroke-width="1.5" opacity="0.7" />
      <polygon points="0,-5 3,-1 7,0 3,1 0,5 -3,1 -7,0 -3,-1" fill="#f59e0b" />
      <line x1="14" y1="0" x2="60" y2="0" stroke="url(#ogGold)" stroke-width="1.5" opacity="0.7" />
    </g>

    <!-- Subtitle on Label -->
    <text x="260" y="388" text-anchor="middle" font-family="'Cinzel', sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#fef3c7">THE KAAVISH RADIO</text>
  </g>

  <!-- RIGHT: Main Typography & Information (from x=620) -->
  <g transform="translate(600, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="280" height="34" rx="17" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
      <circle cx="20" cy="17" r="4.5" fill="#22c55e" />
      <text x="35" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#fde68a" letter-spacing="1.5">LIVE 24/7 AMBIENT SANCTUARY</text>
    </g>

    <!-- Urdu Script Header -->
    <text x="0" y="220" font-family="'Amiri', 'Rozha One', 'Georgia', serif" font-size="28" fill="#fde68a" opacity="0.85" letter-spacing="4">کاوِش • रुहानी शाम</text>

    <!-- Hero Main Title -->
    <text x="0" y="295" font-family="'Cinzel', 'Playfair Display', serif" font-size="64" font-weight="800" letter-spacing="3" fill="#ffffff">The Kaavish Radio</text>

    <!-- Royal Tagline -->
    <text x="0" y="342" font-family="'Cinzel', 'Inter', sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="url(#ogGold)">A Soulful Courtyard of Timeless Harmonies</text>

    <!-- Ambient Feature Tags -->
    <g transform="translate(0, 385)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="16" fill="#d1c5b4" letter-spacing="0.5">
        Faasle • Bachpan • Nindiya Re • Tere Pyaar Mein • Choti Si Baat
      </text>
    </g>

    <g transform="translate(0, 420)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="15" fill="#fbbf24" opacity="0.85" letter-spacing="0.8">
        🌧️ Gentle Rain Atmosphere • 📻 Vintage Vinyl Crackle • 🎙️ Uninterrupted
      </text>
    </g>

    <!-- Divider Line -->
    <line x1="0" y1="455" x2="520" y2="455" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1" />

    <!-- Footer Call to Action -->
    <g transform="translate(0, 490)">
      <text x="0" y="0" font-family="'Cinzel', sans-serif" font-size="14" font-weight="700" fill="#fef3c7" letter-spacing="3">LISTEN LIVE ON ANY DEVICE</text>
      <text x="320" y="0" font-family="'Inter', sans-serif" font-size="13" fill="#a8a29e">• Free &amp; Ad-Free</text>
    </g>
  </g>
</svg>
