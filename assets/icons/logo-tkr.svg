<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Vinyl Radial Background -->
    <radialGradient id="bgVinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241711" />
      <stop offset="55%" stop-color="#140c08" />
      <stop offset="90%" stop-color="#0a0604" />
      <stop offset="100%" stop-color="#050302" />
    </radialGradient>

    <!-- Warm Amber Radial Glow -->
    <radialGradient id="amberAura" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.12" />
      <stop offset="85%" stop-color="#b45309" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="25%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="78%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Subtle Gold Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="#0c0806" />
  
  <!-- Outer Circular Disc -->
  <circle cx="256" cy="256" r="238" fill="url(#bgVinyl)" />
  <circle cx="256" cy="256" r="238" fill="url(#amberAura)" />

  <!-- Outer Golden Frame Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#rimGrad)" stroke-width="4" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 4" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="#d97706" stroke-opacity="0.25" stroke-width="1" />

  <!-- Vinyl Grooves Rings -->
  <circle cx="256" cy="256" r="202" fill="none" stroke="#fbbf24" stroke-opacity="0.08" stroke-width="1" />
  <circle cx="256" cy="256" r="186" fill="none" stroke="#fbbf24" stroke-opacity="0.07" stroke-width="1" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#fbbf24" stroke-opacity="0.08" stroke-width="1" />
  <circle cx="256" cy="256" r="154" fill="none" stroke="#fbbf24" stroke-opacity="0.06" stroke-width="1" />
  <circle cx="256" cy="256" r="138" fill="none" stroke="#fbbf24" stroke-opacity="0.07" stroke-width="1" />

  <!-- Center Label Core -->
  <circle cx="256" cy="256" r="126" fill="#170f0b" stroke="url(#rimGrad)" stroke-width="2" />
  <circle cx="256" cy="256" r="124" fill="url(#amberAura)" opacity="0.6" />

  <!-- Top Urdu Script: کاوِش -->
  <text x="256" y="180" 
        text-anchor="middle" 
        font-family="'Amiri', 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', serif" 
        font-size="28" 
        font-weight="bold" 
        fill="#fde68a" 
        opacity="0.88" 
        letter-spacing="2">کاوِش • रुहानी शाम</text>

  <!-- Central Monogram: TKR -->
  <!-- Drop Shadow behind TKR for 3D depth -->
  <text x="258" y="282" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
        font-size="96" 
        font-weight="900" 
        letter-spacing="8" 
        fill="#000000" 
        opacity="0.75">TKR</text>

  <!-- Glowing Aura for TKR -->
  <text x="256" y="280" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
        font-size="96" 
        font-weight="900" 
        letter-spacing="8" 
        fill="#f59e0b" 
        opacity="0.6" 
        filter="url(#softGlow)">TKR</text>

  <!-- Foreground Crisp Metallic TKR -->
  <text x="256" y="280" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
        font-size="96" 
        font-weight="900" 
        letter-spacing="8" 
        fill="url(#goldMetallic)">TKR</text>

  <!-- Elegant Golden Dividing Ornament -->
  <g transform="translate(256, 304)">
    <line x1="-80" y1="0" x2="-18" y2="0" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
    <circle cx="0" cy="0" r="3.5" fill="#fde68a" />
    <polygon points="0,-7 4,-2 9,0 4,2 0,7 -4,2 -9,0 -4,-2" fill="#f59e0b" />
    <line x1="18" y1="0" x2="80" y2="0" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Subtitle Ribbon: THE KAAVISH RADIO -->
  <text x="256" y="342" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Montserrat', 'Inter', sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="7" 
        fill="#fef3c7">THE KAAVISH RADIO</text>

  <!-- Ambient Subtext: MUSICAL SANCTUARY -->
  <text x="256" y="366" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-size="10.5" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#f59e0b" 
        opacity="0.82">AMBIENT SANCTUARY</text>
        
  <!-- Subtle Spindle Center Dot -->
  <circle cx="256" cy="256" r="4.5" fill="#f59e0b" opacity="0.3" />
</svg>
